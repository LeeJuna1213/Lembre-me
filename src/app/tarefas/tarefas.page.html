<ion-content [fullscreen]="true">
  <button class="sobre" (click)="irParaSobre()">
    ℹ️
  </button>
  <button class="desfazer" (click)="desfazerTodas()">
    🔄
  </button>
  <div class="header">
    <div class="emoji1">
      <img src="assets/emoji1.png" alt="emoji pensativo">
      <p>O que eu preciso fazer?</p>
    </div>
  </div>
  <div class="listaTarefas">
    <ion-reorder-group [disabled]="!reorderArmado" (ionItemReorder)="reordenarTarefas($event)"
      (ionReorderEnd)="reorderArmado = false">
      <ion-card *ngFor="let tarefa of tarefas; let i = index; trackBy: trackById" class="tarefa-card"
        [class.dica-arraste]="mostrarDicaArraste && i === 0">

        <ion-reorder (touchstart)="iniciarPressaoReorder($event)" (touchmove)="moverPressaoReorder($event)"
          (touchend)="cancelarPressaoReorder()" (touchcancel)="cancelarPressaoReorder()"
          (mousedown)="iniciarPressaoReorder($event)" (mousemove)="moverPressaoReorder($event)"
          (mouseup)="cancelarPressaoReorder()" (mouseleave)="cancelarPressaoReorder()">
          <ion-item lines="none">
            <ion-avatar slot="start" class="emoji">
              <span>{{ tarefa.emoji }}</span>
            </ion-avatar>
            <ion-label>
              <h2 class="titulo">{{ tarefa.titulo }}</h2>
              <div class="etiquetas" *ngIf="getEtiquetas(tarefa).length">
                <span *ngFor="let e of getEtiquetas(tarefa)" class="badge-etiqueta" [style.background-color]="e.cor">
                  {{ e.emoji }} {{ e.texto }}
                </span>
              </div>
              <p class="datahora" *ngIf="tarefa.feito">
                ✅ {{ formatarDataFeito(tarefa.datetime) }}
              </p>
              <p class="info-lembrete" *ngIf="textoLembrete(tarefa) as texto">
                ⏰ {{ texto }}
              </p>
            </ion-label>
          </ion-item>
        </ion-reorder>
        <div class="botao-container">
          <button class="acao-btn" (click)="acaoTarefa(tarefa)">
            {{ tarefa.feito ? 'Conferir' : 'Fazer' }}
          </button>
        </div>
      </ion-card>
    </ion-reorder-group>
    <ion-card class="add">
      <button class="addTarefa" (click)="irParaAddTarefa()">
        Nova tarefa
      </button>
    </ion-card>
  </div>
  <br> <br> <br>
</ion-content>
